<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Letter for Çağla</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Outfit:wght@300;400;500;600&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #fbf7ee;
      --paper-cream: #fffef9;
      --envelope-front: #dfcdb5;
      --envelope-back: #caa788;
      --envelope-flap: #ceab8c;
      --ink: #2d2a26;
    }

    body {
      background-color: var(--bg-cream);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      color: var(--ink);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .font-handwriting {
      font-family: 'Caveat', cursive;
    }

    /* Subtle paper noise texture pattern */
    .bg-paper-pattern {
      background-color: #faf6ee;
      background-image: 
        radial-gradient(#e5dbcb 0.75px, transparent 0.75px), 
        radial-gradient(#e5dbcb 0.75px, #faf6ee 0.75px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
    }

    /* Envelope 3D styling & animations */
    .envelope-perspective {
      perspective: 1200px;
    }

    .envelope-flap {
      transform-origin: top center;
      transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .envelope-flap.opened {
      transform: rotateX(180deg);
      z-index: 5 !important;
    }

    .letter-paper {
      transform-origin: bottom center;
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease, z-index 0.1s step-end;
    }

    .letter-paper.extracted {
      transform: translateY(-190px) scale(1.02);
      z-index: 40 !important;
    }

    @media (max-width: 640px) {
      .letter-paper.extracted {
        transform: translateY(-140px) scale(1.01);
      }
    }

    /* Cassette reels rotating */
    @keyframes spin-reels {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .reels-spinning {
      animation: spin-reels 2.2s linear infinite;
    }

    /* Bean character idle animation */
    @keyframes bean-idle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .bean-bobbing {
      animation: bean-idle 2.4s ease-in-out infinite;
    }

    /* Play button pulse */
    @keyframes pulse-ring {
      0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(224, 102, 102, 0.45); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(224, 102, 102, 0); }
      100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(224, 102, 102, 0); }
    }

    .pulse-btn {
      animation: pulse-ring 2.2s infinite;
    }

    .polaroid-card {
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 3px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #dfcbaf;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-paper-pattern min-h-screen flex flex-col justify-center items-center p-4 overflow-x-hidden relative">

  <!-- Ambient Floating Music Notes -->
  <div id="notes-container" class="fixed inset-0 pointer-events-none z-30 overflow-hidden opacity-0 transition-opacity duration-1000"></div>

  <!-- MAIN INTERACTIVE STAGE -->
  <main class="relative w-full max-w-lg flex flex-col items-center justify-center my-auto">
    
    <!-- ENVELOPE CONTAINER -->
    <div class="relative w-full envelope-perspective max-w-[430px]">
      
      <!-- Big Envelope Outer Body -->
      <div id="envelope-box" class="relative w-full aspect-[1.45/1] rounded-2xl bg-[#ceab8c] shadow-2xl border-4 border-[#bda084] flex items-center justify-center overflow-visible">
        
        <!-- Back inside layer -->
        <div class="absolute inset-0 rounded-xl bg-[#b59273] shadow-inner"></div>

        <!-- THE LETTER PAPER -->
        <div id="letter-paper" class="letter-paper absolute w-[94%] h-[126%] top-[4%] bg-[#fffdf9] rounded-xl shadow-xl border border-[#ecd9be] p-5 sm:p-6 flex flex-col justify-between opacity-0 pointer-events-none z-10">
          
          <div>
            <h2 id="letter-title" class="text-3xl sm:text-4xl font-handwriting font-bold text-amber-950">Sevgili Çağla,</h2>
            <div id="letter-body" class="mt-3 overflow-y-auto max-h-[160px] sm:max-h-[180px] pr-2 custom-scroll text-stone-800 text-lg sm:text-xl font-handwriting leading-relaxed">
              <!-- Dynamically populated from CONFIG -->
            </div>
          </div>

          <!-- Letter Bottom: Simple Photo Album Trigger -->
          <div class="pt-2 border-t border-amber-100/80 flex items-center justify-between">
            <span id="letter-signoff" class="font-handwriting text-stone-400 text-lg">always,</span>
            <button onclick="togglePolaroidModal(true)" class="flex items-center gap-1.5 px-3 py-1.5 bg-[#f6eee3] hover:bg-[#ebdccb] text-amber-900 rounded-full text-xs font-medium border border-amber-200 transition active:scale-95 shadow-sm">
              <span>📷 Fotoğraflarımız</span>
            </button>
          </div>
        </div>

        <!-- Envelope Fold SVG Triangles -->
        <div class="absolute inset-0 pointer-events-none z-20">
          <svg class="absolute left-0 top-0 h-full w-1/2 drop-shadow" viewBox="0 0 200 280" preserveAspectRatio="none">
            <polygon points="0,0 200,140 0,280" fill="#d9be9e" />
          </svg>
          <svg class="absolute right-0 top-0 h-full w-1/2 drop-shadow" viewBox="0 0 200 280" preserveAspectRatio="none">
            <polygon points="200,0 0,140 200,280" fill="#d0b391" />
          </svg>
          <svg class="absolute bottom-0 left-0 w-full h-[58%] drop-shadow-md" viewBox="0 0 400 160" preserveAspectRatio="none">
            <polygon points="0,160 200,30 400,160" fill="#caa788" />
          </svg>
        </div>

        <!-- Top Flap with 3D Open -->
        <div id="envelope-flap" class="envelope-flap absolute top-0 left-0 w-full h-[56%] z-30 pointer-events-none">
          <svg class="w-full h-full drop-shadow-lg" viewBox="0 0 400 160" preserveAspectRatio="none">
            <polygon points="0,0 200,160 400,0" fill="#dfcdb5" stroke="#bda084" stroke-width="2" />
          </svg>
        </div>

        <!-- Center Play Button (The Wax Seal) -->
        <div id="play-seal" class="absolute z-50 flex flex-col items-center justify-center cursor-pointer group pointer-events-auto">
          <button id="main-play-btn" onclick="triggerLetterSequence()" aria-label="Play tape and open letter" class="pulse-btn relative w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-tr from-rose-700 via-rose-600 to-amber-500 shadow-xl flex items-center justify-center border-4 border-amber-100 text-white transition-all transform group-hover:scale-105 active:scale-95 cursor-pointer">
            <svg class="w-6 h-6 sm:w-7 sm:h-7 fill-current translate-x-0.5 filter drop-shadow pointer-events-none" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>
        </div>

      </div>

      <!-- MINI DOODLE BEAN & COMPACT RETRO TAPE PLAYER RIG -->
      <div class="absolute -bottom-10 -right-4 sm:-bottom-12 sm:-right-8 z-40 flex items-end pointer-events-none">
        
        <!-- Small Cassette Player Deck -->
        <div class="relative w-[120px] bg-[#332f2c] rounded-xl p-2 shadow-xl border-2 border-[#201d1b]">
          <!-- Window for tape slot -->
          <div class="relative w-full h-11 bg-[#181615] rounded-md border border-stone-700 flex items-center justify-center overflow-hidden">
            
            <!-- Tape inside player deck -->
            <div id="deck-tape-instance" class="relative w-[96px] h-[34px] bg-[#433f3c] rounded p-1 flex flex-col justify-between opacity-0 transition-opacity duration-300">
              <div class="w-full bg-[#f6eee3] rounded-sm px-1 py-0.5 flex justify-between items-center text-[6px] font-mono text-stone-800 font-bold">
                <span>WISH YOU WERE HERE</span>
              </div>
              <div class="w-full flex items-center justify-around px-2">
                <!-- Spool Left -->
                <div class="w-3.5 h-3.5 rounded-full bg-white flex items-center justify-center reel-element">
                  <div class="w-1.5 h-1.5 rounded-full bg-stone-900"></div>
                </div>
                <div class="w-4 h-1 bg-stone-800 rounded"></div>
                <!-- Spool Right -->
                <div class="w-3.5 h-3.5 rounded-full bg-white flex items-center justify-center reel-element">
                  <div class="w-1.5 h-1.5 rounded-full bg-stone-900"></div>
                </div>
              </div>
            </div>

            <!-- Empty slot line indicator -->
            <div id="deck-empty-hint" class="w-10 h-0.5 bg-stone-700/80 rounded"></div>
          </div>

          <!-- Small buttons bar -->
          <div class="flex justify-between items-center mt-1.5 px-0.5">
            <div class="flex gap-1">
              <span id="deck-rec-led" class="w-1.5 h-1.5 rounded-full bg-rose-500/80"></span>
            </div>
            <div class="flex gap-1">
              <div id="deck-play-btn" class="w-4 h-2 bg-emerald-700 rounded-sm"></div>
              <div class="w-4 h-2 bg-stone-700 rounded-sm"></div>
            </div>
          </div>
        </div>

        <!-- Little Doodle Bean Guy -->
        <div class="relative w-[90px] h-[95px] -ml-2 pointer-events-none">
          <svg viewBox="0 0 140 140" class="w-full h-full overflow-visible">
            <!-- Shadow -->
            <ellipse cx="68" cy="130" rx="32" ry="7" fill="#2d2a26" opacity="0.12" />

            <!-- Bean character body -->
            <g class="bean-bobbing">
              <!-- Feet -->
              <path d="M 50 124 C 45
